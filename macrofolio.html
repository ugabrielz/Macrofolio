const DEFAULT_MEALS=['Café da manhã','Almoço','Lanche','Jantar','Ceia'];
let MEALS=[...DEFAULT_MEALS];
const $=s=>document.querySelector(s),app=$('#app');
const r=(x,d=0)=>Math.round(x*10**d)/10**d;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let S={goals:null,days:{},date:null,theme:null,achievements:[]},tab='cal',meal='Almoço',q='',defG=100,srch=false;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('macrofolio')||'{}'))}catch(e){}
function save(){stamp();for(const k in S.days)if(!S.days[k].length)delete S.days[k];try{localStorage.setItem('macrofolio',JSON.stringify(S))}catch(e){}}
function setTheme(t){document.documentElement.dataset.theme=t}
setTheme(S.theme||'dark');
function toggleTheme(){S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';setTheme(S.theme);save()}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',1800)}
const calc=(f,g)=>{const m=g/100;return{k:f.k*m,p:f.p*m,c:f.c*m,f:f.f*m,b:f.b*m}};

function viewChoose(){app.innerHTML=`<div class="wrap"><h1>${ic('dumb')} Macrofolio</h1><p class="mut">Monte suas refeições e acompanhe seus macros. Como quer começar?</p>
<button class="big" onclick="viewManual()">${ic('pencil')} <b>Já sei meus macros</b><small>Digite suas metas diárias</small></button>
<button class="big" onclick="viewCalc()">${ic('calc')} <b>Não sei meus macros, quero calcular</b><small>Informe altura, peso e nível de atividade</small></button></div>`}
function viewManual(g,note){g=g||S.goals||{};const i=(id,l,v)=>`<div><label>${l}<input id="${id}" type="number" inputmode="decimal" min="0" value="${v||''}"></label></div>`;
app.innerHTML=`<div class="wrap"><h1>Suas metas</h1>${note?`<div class="expense-card">${note}</div>`:''}<div class="grid">${i('gk','Calorias (kcal)',g.k)}${i('gp','Proteína (g)',g.p)}${i('gc','Carboidrato (g)',g.c)}${i('gf','Gordura (g)',g.f)}${i('gb','Fibras (g)',g.b)}</div>
<p class="mut" style="font-size:13px">Se deixar as kcal vazias, calculamos a partir dos macros.</p>
<div class="setup-actions"><button class="pri" style="width:100%;padding:12px" onclick="saveGoals()">Começar</button>
<button style="width:100%" onclick="${S.goals?'main()':'viewChoose()'}">Voltar</button></div></div>`}
function saveGoals(){const v=id=>+$('#'+id).value||0;let p=v('gp'),c=v('gc'),f=v('gf'),k=v('gk');if(!k)k=4*p+4*c+9*f;if(!k){toast('Informe ao menos as kcal ou os macros');return}S.goals={k:r(k),p,c,f,b:v('gb')};save();main()}
function viewCalc(){app.innerHTML=`<div class="wrap"><h1>Calcular macros</h1><div class="grid">
<div><label>Sexo<select id="sx"><option value="m">Masculino</option><option value="f">Feminino</option></select></label></div>
<div><label>Idade<input id="a" type="number" inputmode="numeric"></label></div>
<div><label>Altura (cm)<input id="h" type="number" inputmode="numeric"></label></div>
<div><label>Peso (kg)<input id="w" type="number" inputmode="decimal"></label></div></div>
<label style="margin-top:10px">Nível de atividade<select id="act"><option value="1.2">Sedentário (pouco ou nenhum exercício)</option><option value="1.375">Leve (1–3x por semana)</option><option value="1.55" selected>Moderado (3–5x por semana)</option><option value="1.725">Intenso (6–7x por semana)</option><option value="1.9">Muito intenso (2x por dia / trabalho braçal)</option></select></label>
<label style="margin-top:10px">Objetivo<select id="obj"><option value="0.8">Emagrecer</option><option value="1" selected>Manter peso</option><option value="1.1">Ganhar massa</option></select></label>
<div class="setup-actions"><button class="pri" style="width:100%;padding:12px" onclick="calcGoals()">Calcular</button>
<button style="width:100%" onclick="viewChoose()">Voltar</button></div></div>`}
function calcGoals(){const w=+$('#w').value,h=+$('#h').value,a=+$('#a').value;if(!w||!h||!a){toast('Preencha idade, altura e peso');return}
const bmr=10*w+6.25*h-5*a+($('#sx').value=='m'?5:-161),tdee=bmr*+$('#act').value,k=tdee*+$('#obj').value;
const p=2*w,f=0.9*w,c=Math.max(0,(k-4*p-9*f)/4);
S.goalType=$('#obj').value=='0.8'?'emagrecer':$('#obj').value=='1.1'?'ganhar':'manter';S.maintenanceKcal=r(tdee);

async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}toast('No iPhone, use Compartilhar → Adicionar à Tela de Início')}
const goalLabel=t=>t=='emagrecer'?'Emagrecer':t=='ganhar'?'Ganhar massa':'Manter peso';
function avatarHTML(p){const n=(p.name||'?').trim();return p.photo?`<img src="${p.photo}" alt="Foto de ${esc(n)}">`:`<span>${esc((n[0]||'?').toUpperCase())}</span>`}
function renderProfile(){const el=$('#body'),p=S.profile||{},has=!!S.profile,goal=S.goalType||'manter',editing=!has||profileEditing;el.innerHTML=`<div class="card profile-hero"><div id="profilePreview" class="profile-avatar">${avatarHTML(p)}</div><div><h2>${has?esc(p.name):'Seu perfil'}</h2><p>${has?(p.motto?esc(p.motto):'Sua jornada começa hoje.'):'Personalize sua jornada.'}</p></div></div>${has&&!editing?`<button class="pri" style="width:100%;margin-top:14px;padding:12px" onclick="editProfile()">Editar perfil</button>`:''}<h2 style="${editing?'':'display:none'}">${has?'Editar perfil':'Criar perfil'}</h2><div class="card" style="display:${editing?'block':'none'}"><label>Foto<input type="file" accept="image/*" onchange="profilePhoto(event)"></label><label style="margin-top:8px">Nome<input id="pn" maxlength="32" value="${esc(p.name||'')}" placeholder="Como você quer ser chamado?"></label><label style="margin-top:8px">Sua meta em uma frase<input id="pm" maxlength="110" value="${esc(p.motto||'')}" placeholder="Ex.: Quero ter mais energia no meu dia"></label><label style="margin-top:8px">Objetivo<select id="pg"><option value="emagrecer" ${goal=='emagrecer'?'selected':''}>Emagrecer</option><option value="manter" ${goal=='manter'?'selected':''}>Manter peso</option><option value="ganhar" ${goal=='ganhar'?'selected':''}>Ganhar massa</option></select></label><button class="pri" style="width:100%;margin-top:14px;padding:12px" onclick="saveProfile()">Salvar perfil</button></div><h2>Sua jornada</h2><button class="profile-option" onclick="openAchievements()"><span>${ic('star')}</span><div class="info"><b>Conquistas</b><small>Medalhas e marcos alcançados</small></div><span>›</span></button><button class="profile-option" onclick="openTimeline()"><span>${ic('chart')}</span><div class="info"><b>Linha do tempo</b><small>Histórico e progresso das metas</small></div><span>›</span></button><button class="profile-option" onclick="openHelp()"><span>?</span><div class="info"><b>Ajuda</b><small>Fale com o suporte</small></div><span>›</span></button>${has?`<button style="width:100%;margin-top:14px;color:#C83D3D;background:#FFE8E8" onclick="askDeleteProfile()">Excluir perfil</button>`:''}`}
function editProfile(){profileEditing=true;renderProfile()}
function profilePhoto(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Escolha uma foto de até 2 MB');return}const rd=new FileReader;rd.onload=()=>{S.profileDraftPhoto=rd.result;const p=$('#profilePreview');if(p)p.innerHTML=`<img src="${rd.result}" alt="Prévia da foto">`};rd.readAsDataURL(f)}
function saveProfile(){const n=$('#pn').value.trim(),m=$('#pm').value.trim();if(!n){toast('Informe seu nome');return}const old=S.profile||{};S.profile={name:n,motto:m,photo:S.profileDraftPhoto||old.photo||'',createdAt:old.createdAt||new Date().toISOString()};delete S.profileDraftPhoto;S.goalType=$('#pg').value;S.achievements=S.achievements||[];if(!S.achievements.some(a=>a.id=='profile-created'))S.achievements.push({id:'profile-created',title:'Primeiro passo',detail:'Você criou seu perfil no Macrofolio.',emoji:'🌱',medal:'cobre',date:new Date().toISOString()});profileEditing=false;save();renderProfile();toast('Perfil salvo')}
function openAchievements(){const a=(S.achievements||[]).slice().sort((x,y)=>new Date(y.date)-new Date(x.date));modal(`<b style="font-size:17px">${ic('star')} Conquistas</b><p class="mut" style="margin:4px 0 10px;font-size:13px">${a.length} medalha${a.length==1?'':'s'} guardada${a.length==1?'':'s'} na sua jornada.</p>${a.length?a.map(x=>{const i=(S.achievements||[]).indexOf(x),m=MEDAL[x.medal]||MEDAL.cobre;return `<div class="achievement-card"><div class="medal ${x.medal||'cobre'}">${x.emoji||ic('star')}</div><div class="info"><b>${esc(x.title)}</b><small>${new Date(x.date).toLocaleDateString('pt-BR')} · ${m.name}</small>${x.detail?`<small>${esc(x.detail)}</small>`:''}</div><button onclick="shareAchievement(${i})">Compartilhar</button></div>`}).join(''):`<div class="empty">Suas próximas conquistas aparecerão aqui.</div>`}<div class="acts"><button onclick="closeM()">Fechar</button></div>`)}
function shareAchievement(i){const a=(S.achievements||[])[i],n=S.profile?.name||'Eu';if(!a)return;const m=MEDAL[a.medal]||MEDAL.cobre,c=document.createElement('canvas');c.width=1200;c.height=630;const x=c.getContext('2d');x.fillStyle='#0B8A3E';x.fillRect(0,0,c.width,c.height);x.fillStyle='#DDF5E5';x.beginPath();x.arc(165,230,92,0,Math.PI*2);x.fill();x.fillStyle=m.color;x.beginPath();x.arc(165,230,62,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='48px sans-serif';x.fillText(a.emoji||'★',140,247);x.font='bold 42px sans-serif';x.fillText('MACROFOLIO',300,125);x.font='bold 62px sans-serif';x.fillText(a.title,300,235);x.font='32px sans-serif';x.fillText(`${n} conquistou esta medalha de ${m.name.toLowerCase()}.`,300,300);x.fillText('Minha jornada, um dia de cada vez.',300,365);c.toBlob(async b=>{const file=new File([b],'conquista-macrofolio.png',{type:'image/png'}),text=`${n} conquistou: ${a.title} no Macrofolio.`;try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({title:'Minha conquista no Macrofolio',text,files:[file]});else if(navigator.share)await navigator.share({title:'Minha conquista no Macrofolio',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('Texto da conquista copiado')}else toast('Compartilhamento não disponível neste navegador')}catch(e){}})}
function openHelp(){modal(`<b style="font-size:17px">Ajuda</b><p class="mut" style="margin:6px 0 10px">Precisa de ajuda com a sua jornada ou encontrou algum problema?</p><div class="note"><b>Contato</b><br><a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a></div><div class="acts"><button onclick="closeM()">Fechar</button><button class="pri" onclick="installApp()">Instalar aplicativo</button></div>`)}
function askDeleteProfile(){modal(`<b style="font-size:17px">Excluir seu perfil?</b><p class="mut" style="margin:6px 0">Seu nome, foto, frase e conquistas serão apagados deste dispositivo. As dietas registradas serão mantidas.</p><div class="acts"><button onclick="closeM()">Cancelar</button><button class="pri" style="background:#FF5C5C;color:#fff" onclick="doDeleteProfile()">Excluir perfil</button></div>`)}
function doDeleteProfile(){delete S.profile;delete S.achievements;delete S.profileDraftPhoto;delete S.goalType;delete S.maintenanceKcal;profileEditing=false;save();closeM();renderProfile();toast('Perfil excluído')}
function openTimeline(){const ks=Object.keys(S.days).filter(k=>S.days[k].length).sort(),g=S.goals;if(!ks.length){modal(`<b style="font-size:17px">${ic('chart')} Linha do tempo</b><div class="empty">Registre alimentos em um dia para começar sua linha do tempo.</div><div class="acts"><button onclick="closeM()">Fechar</button></div>`);return}const base=S.maintenanceKcal||g.k,type=S.goalType||'manter';let hit=0,deficit=0,surplus=0;const rows=ks.map((k,i)=>{const t=totals(S.days[k]),ok=[['k',g.k],['p',g.p],['c',g.c],['f',g.f]].every(([x,v])=>!v||(t[x]>=v*.9&&t[x]<=v*1.1));if(ok)hit++;const d=base-t.k;if(d>0)deficit+=d;else surplus-=d;const left=Math.max(0,r(g.k-t.k));return `<div class="timeline-row" style="--d:${Math.min(i,8)*.1}s"><b style="text-transform:capitalize">${fmt(k)}</b><small class="${ok?'timeline-hit':'timeline-miss'}">${ok?'Meta do dia batida':'Meta ainda não atingida'}</small><small>${ok?`${r(t.k)} kcal registradas`:left?`Faltaram ${left} kcal para a meta`:`${r(t.k-g.k)} kcal acima da meta`}</small></div>`}).join('');const estimate=type=='emagrecer'?`Perda teórica: <b>${r(deficit/7700,2)} kg</b>`:type=='ganhar'?`Ganho teórico de massa: <b>${r(surplus/7700,2)} kg</b>`:`Dias próximos da manutenção: <b>${hit}</b>`;modal(`<b style="font-size:17px">${ic('chart')} Linha do tempo</b><p class="mut" style="margin:4px 0 8px;font-size:13px">Desde ${fmt(ks[0])} · objetivo: ${goalLabel(type)}</p><div class="timeline-summary"><b>${hit}/${ks.length} dias</b> com as metas batidas<br>${estimate}<br><small>Estimativas calóricas; não substituem avaliação profissional e ganho de massa não é medido diretamente.</small></div><div class="timeline-list">${rows}</div><div class="acts"><button onclick="closeM()">Fechar</button></div>`)}
let calM=new Date().getMonth(),cpK=null,wk;
const fmt=k=>new Date(k+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const dk=d=>key(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)};
const wkStart=k=>addD(k,-new Date(k+'T12:00:00').getDay());
const modal=h=>{$('#modal').innerHTML=`<div class="mb" onclick="if(event.target==this)closeM()"><div class="mc card">${h}</div></div>`};
const closeM=()=>{$('#modal').innerHTML=''};
function pickDay(k){S.date=k;calY=+k.slice(0,4);calM=+k.slice(5,7)-1;save();summary();setTab('diet')}
function navM(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}renderCal()}
function renderCal(){const first=new Date(calY,calM,1).getDay(),n=new Date(calY,calM+1,0).getDate();
let h=`<div class="yr"><button onclick="navM(-1)" aria-label="Mês anterior">‹</button><b>${MN[calM]} ${calY}</b><button onclick="navM(1)" aria-label="Próximo mês">›</button></div><div class="card"><div class="dg">`+['D','S','T','Q','Q','S','S'].map(x=>`<span class="wd">${x}</span>`).join('')+'<i></i>'.repeat(first);
for(let d=1;d<=n;d++){const k=key(calY,calM,d),has=(S.days[k]||[]).length;h+=`<button class="d lg${has?' has':''}${k==todayK()?' td':''}${k==S.date?' sel':''}" onclick="pickDay('${k}')" title="${has?has+' itens':''}">${d}</button>`}
$('#body').innerHTML=h+`</div></div><div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1" onclick="calY=new Date().getFullYear();calM=new Date().getMonth();renderCal()">Hoje</button><button class="pri" style="flex:1" onclick="openWeek()">${ic('chart')} Resumo semanal</button></div><p class="mut" style="font-size:12px">Dias com fundo verde têm dieta registrada. Toque em um dia para ver ou montar a dieta dele.</p>`}

function mealsHTML(k){const L0=S.days[k]||[];if(!L0.length)return '<div class="empty">Sem dieta registrada neste dia.</div>';const t=totals(L0);
return MEALS.map(m=>{const L=L0.filter(x=>x.m==m);return L.length?`<h2 style="margin:10px 0 4px">${m}</h2>`+L.map(it=>`<div class="ml" style="padding:2px 0;gap:8px"><span>${F[it.i].n} · ${it.n} ${it.u=='g'?'g':it.u+' ('+r(gOf(it))+' g)'}</span><span style="white-space:nowrap">${r(calc(F[it.i],gOf(it)).k)} kcal</span></div>`).join(''):''}).join('')+`<div class="note"><b>${r(t.k)} kcal</b> · P ${r(t.p,1)} · C ${r(t.c,1)} · G ${r(t.f,1)}</div>`}
function openCopy(){cpK=null;renderCopy()}
function renderCopy(){const rec=Object.keys(S.days).filter(k=>k!=S.date&&S.days[k].length).sort().reverse().slice(0,6),ok=cpK&&cpK!=S.date&&(S.days[cpK]||[]).length;
modal(`<b style="font-size:17px">Copiar dieta de outro dia</b><p class="mut" style="margin:4px 0 8px;font-size:13px">Destino: <span style="text-transform:capitalize">${dlabel()}</span></p>
<label>Escolha o dia<input type="date" value="${cpK||''}" onchange="cpK=this.value||null;renderCopy()"></label>
${rec.length?`<div class="chips">${rec.map(k=>`<button class="${k==cpK?'on':''}" onclick="cpK='${k}';renderCopy()">${fmt(k)}</button>`).join('')}</div>`:''}
${cpK?(cpK==S.date?'<div class="empty">Escolha um dia diferente do atual.</div>':`<h2 style="text-transform:capitalize">Dieta de ${fmt(cpK)}</h2>${mealsHTML(cpK)}`):''}
<div class="acts"><button onclick="closeM()">Cancelar</button>${ok?(items().length?`<button class="pri" onclick="doCopy(0)">Adicionar</button><button class="pri" onclick="doCopy(1)">Substituir</button>`:`<button class="pri" onclick="doCopy(0)">Confirmar cópia</button>`):''}</div>`)}
function doCopy(rep){const src=(S.days[cpK]||[]).map(it=>({...it,id:Date.now()+Math.random()}));S.days[S.date]=rep?src:items().concat(src);closeM();save();summary();setTab('diet');toast('Dieta copiada');if(!scanAchievements(true))warnBulk(src.map(it=>({id:it.id,i:it.i,g:gOf(it),m:it.m})))}

let mt=new Set(),vY,vM;
function openMulti(){mt=new Set();vY=+S.date.slice(0,4);vM=+S.date.slice(5,7)-1;renderMulti()}
function navV(n){vM+=n;if(vM<0){vM=11;vY--}if(vM>11){vM=0;vY++}renderMulti()}
function tgl(k){mt.has(k)?mt.delete(k):mt.add(k);renderMulti()}
function next7(){for(let i=1;i<=7;i++)mt.add(addD(S.date,i));renderMulti()}
function renderMulti(){const first=new Date(vY,vM,1).getDay(),n=new Date(vY,vM+1,0).getDate(),t=totals(items()),conf=[...mt].some(k=>(S.days[k]||[]).length);
let g='';for(let d=1;d<=n;d++){const k=key(vY,vM,d),has=(S.days[k]||[]).length;g+=`<button class="d${has?' has':''}${mt.has(k)?' sel':''}${k==S.date?' td':''}" ${k==S.date?'disabled':''} onclick="tgl('${k}')">${d}</button>`}
modal(`<b style="font-size:17px">Copiar para vários dias</b><div class="note"><b>Dieta a copiar:</b> <span style="text-transform:capitalize">${fmt(S.date)}</span> · ${items().length} itens · ${r(t.k)} kcal · P ${r(t.p)} · C ${r(t.c)} · G ${r(t.f)}</div>
<div class="yr"><button onclick="navV(-1)">‹</button><b style="font-size:16px">${MN[vM]} ${vY}</b><button onclick="navV(1)">›</button></div>
<div class="dg">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="wd">${x}</span>`).join('')}${'<i></i>'.repeat(first)}${g}</div>
<div class="chips"><button onclick="next7()">Próximos 7 dias</button><button onclick="mt=new Set();renderMulti()">Limpar seleção</button></div>
<p class="mut" style="font-size:12px;margin:8px 0 0">Toque nos dias de destino (verde claro = já tem dieta). Selecionados: <b>${mt.size}</b></p>
<div class="acts"><button onclick="closeM()">Cancelar</button>${mt.size?(conf?`<button class="pri" onclick="doMulti(0)">Adicionar</button><button class="pri" onclick="doMulti(1)">Substituir</button>`:`<button class="pri" onclick="doMulti(0)">Copiar para ${mt.size} dia${mt.size>1?'s':''}</button>`):''}</div>`)}
function doMulti(rep){const src=items(),c=mt.size;mt.forEach(k=>{const cp=src.map(it=>({...it,id:Date.now()+Math.random()}));S.days[k]=rep?cp:(S.days[k]||[]).concat(cp)});mt=new Set();closeM();save();toast(`Dieta copiada para ${c} dia${c>1?'s':''}`);scanAchievements(true)}

function openWeek(){wk=wkStart(S.date);renderWeek()}
function renderWeek(){const g=S.goals,ks=[0,1,2,3,4,5,6].map(i=>addD(wk,i)),tot={k:0,p:0,c:0,f:0,b:0};let n=0,hit=0;
const rows=ks.map((k,i)=>{const t=totals(S.days[k]||[]),has=(S.days[k]||[]).length,ratio=has&&g.k?t.k/g.k:0;if(has){n++;for(const x in tot)tot[x]+=t[x];if(ratio>=.9&&ratio<=1.05)hit++}const h=has?Math.max(8,Math.min(115,ratio*100)):4,color=!has?'var(--bd)':ratio>1.05?'#FF5C5C':ratio>=.9?'var(--ac)':'var(--c)',day=new Date(k+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'narrow'});return `<button class="week-day" style="--h:${h};--bar:${color};--d:${i*.08}s" onclick="closeM();pickDay('${k}')" title="${has?r(t.k)+' kcal':'Sem registro'}"><span class="week-kcal">${has?r(t.k):'—'}</span><i class="week-bar"></i><b>${day}</b><small>${k.slice(8)}</small></button>`}).join('');
const a=x=>n?tot[x]/n:0;
modal(`<div class="yr"><button onclick="wk=addD(wk,-7);renderWeek()">‹</button><b style="font-size:15px;text-transform:capitalize">${fmt(ks[0])} – ${fmt(ks[6])}</b><button onclick="wk=addD(wk,7);renderWeek()">›</button></div><div class="week-hero"><small>SEU RITMO</small><strong>${hit}<span> dias na meta</span></strong><p>${n?`Você registrou ${n} de 7 dias nesta semana.`:'Comece registrando seu primeiro dia da semana.'}</p></div><div class="week-stats"><div class="week-stat"><small>Calorias na semana</small><b>${r(tot.k)}</b><small>kcal consumidas</small></div><div class="week-stat"><small>Média por dia</small><b>${r(a('k'))}</b><small>kcal por dia</small></div></div><h2>Consumo por dia</h2><div class="week-chart">${rows}</div><div class="week-macros"><div class="week-macro"><small>Proteína</small><b style="color:var(--p)">${r(a('p'))} g</b><small>média/dia</small></div><div class="week-macro"><small>Carboidrato</small><b style="color:var(--c)">${r(a('c'))} g</b><small>média/dia</small></div><div class="week-macro"><small>Gordura</small><b style="color:var(--f)">${r(a('f'))} g</b><small>média/dia</small></div></div><div class="note"><b>${n?`${hit} dia${hit==1?'':'s'} dentro da meta de calorias.`:'Ainda não há dias registrados.'}</b><br>${n?`Meta diária: ${r(g.k)} kcal · Total: ${r(tot.k)} kcal em ${n} dia${n==1?'':'s'}.`:'Toque em um dia do gráfico para começar a registrar sua dieta.'}</div><div class="acts"><button onclick="closeM()">Fechar</button></div>`)}

let openDietItems=new Set;
function renderDiet(){const el=$('#body'),L0=items();if(!L0.length){el.innerHTML=`<div class="empty">Nenhuma refeição neste dia.<br><button class="pri" style="margin-top:10px" onclick="setTab('foods')">Adicionar alimentos</button> <button class="pri" style="margin-top:10px" onclick="openType()">${ic('pencil')} Digitar dieta</button> <button style="margin-top:10px" onclick="openCopy()">${ic('copy')} Copiar de outro dia</button></div>`;return}
let h='';MEALS.forEach(m=>{const L=L0.filter(x=>x.m==m);if(!L.length)return;const t=totals(L);
h+=`<h2>${m} · ${r(t.k)} kcal</h2><div class="card">`+L.map(it=>{const f=F[it.i],gr=gOf(it),x=calc(f,gr),open=openDietItems.has(it.id);return `<div class="diet-food${open?' open':''}" onclick="toggleDietItem(${it.id})"><div class="diet-food-head"><b>${f.n}</b></div>${open?`<div class="diet-food-detail"><div class="diet-metrics"><div><small>Quantidade</small><b>${r(gr)} g</b></div><div><small>Calorias</small><b>${r(x.k)} kcal</b></div><div><small>Proteína</small><b>${r(x.p,1)} g</b></div><div><small>Carboidrato</small><b>${r(x.c,1)} g</b></div><div><small>Gordura</small><b>${r(x.f,1)} g</b></div></div><div class="diet-food-edit" onclick="event.stopPropagation()"><input class="g" type="number" min="0.1" step="any" value="${it.n}" onchange="editQ(${it.id},this.value)" aria-label="quantidade"><select class="u" onchange="editU(${it.id},this.value)">${uopt(f,it.u)}</select><select class="u move" onchange="moveI(${it.id},this.value)">${MEALS.map(o=>`<option ${o==it.m?'selected':''}>${o}</option>`).join('')}</select><button class="x" onclick="delI(${it.id})" title="Remover">${ic('x')}</button></div></div>`:''}</div>`}).join('')+`</div>`});
el.innerHTML=h+`<button class="pri" style="width:100%;margin-top:16px" onclick="openType()">${ic('pencil')} Digitar alimentos</button><button style="width:100%;margin-top:8px" onclick="openCopy()">${ic('copy')} Copiar de outro dia</button><button style="width:100%;margin-top:8px" onclick="openMulti()">${ic('layers')} Copiar para vários dias</button><button style="width:100%;margin-top:8px" onclick="askClear()">Limpar dieta do dia</button>`}
function toggleDietItem(id){openDietItems.has(id)?openDietItems.delete(id):openDietItems.add(id);renderDiet()}
const upd=()=>{save();summary();renderDiet();scanAchievements(true)};
const gi=id=>items().find(x=>x.id==id);
function editQ(id,v){v=+v;const it=gi(id),old=gOf(it);if(v>0)it.n=v;upd();if(gOf(it)>old)checkOver({id,i:it.i,g:gOf(it),m:it.m})}
function editU(id,u){const it=gi(id),g=gOf(it);it.u=u;it.n=r(g/ug(F[it.i],u),1)||1;upd()}

function foodTips(f){const n=norm(f.n),tags=[];if(/agua/.test(n))tags.push('Contribui para a hidratação.');if(f.p>=10)tags.push('Fonte de proteína, importante para saciedade e manutenção muscular.');if(f.c>=15)tags.push('Fornece carboidratos para energia no dia a dia.');if(f.b>=3)tags.push('Tem fibras que ajudam na saciedade e no funcionamento intestinal.');if(f.f>=10)tags.push('Fornece gorduras, que participam da absorção de vitaminas.');if(!tags.length)tags.push('Pode compor uma alimentação variada quando usado nas quantidades adequadas.');let prep=['em receitas','na porção indicada','como preferir'];if(f.g=='Frutas')prep=['ao natural','em vitamina','em salada de frutas'];else if(/Aves|Carne bovina|Porco/.test(f.g))prep=['grelhado','assado','cozido'];else if(/Peixes/.test(f.g))prep=['grelhado','assado','na airfryer'];else if(/Vegetais/.test(f.g))prep=['cru','no vapor','refogado'];else if(/Arroz|Leguminosas|Tubérculos/.test(f.g))prep=['cozido','em bowl','como acompanhamento'];else if(/Pães/.test(f.g))prep=['tostado','em sanduíche','como lanche'];else if(/Doces e bebidas/.test(f.g))prep=['gelado','em receitas','na porção indicada'];else if(/Ovos e laticínios/.test(f.g))prep=['ao natural','em omelete','em receitas'];return{benefits:tags.slice(0,2).join(' '),prep}}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WN={um:1,uma:1,meio:.5,meia:.5,dois:2,duas:2,tres:3,quatro:4,cinco:5};
const UN=[['colher de sopa',/colhere?s? de sopa|colhere?s? sopa/],['colher de chá',/colhere?s? de cha/],['colher de sopa',/colhere?s?/],['fatia',/fatias?/],['copo',/copos?/],['xícara',/xicaras?/],['concha',/conchas?/],['escumadeira',/escumadeiras?/],['filé',/files?/],['bife',/bifes?/],['punhado',/punhados?/],['scoop',/scoops?/],['lata',/latas?/],['porção',/porcao|porcoes/],['pedaço',/pedacos?/],['unidade',/unidades?|unid\b/]];
const stem=w=>w.replace(/(ae|oe)s$/,'ao').replace(/s$/,'');
const WORDS=F.map(f=>norm(f.n).split(/[^a-z0-9]+/));
function parseLine(l){let t=norm(l).replace(/\(.*?\)/g,' '),grams=null,n=null,unit=null,m;
if(m=t.match(/(\d+(?:[.,]\d+)?)\s*(kg|gramas?|gr|g|ml|l)\b/)){const v=+m[1].replace(',','.');grams=/^(kg|l)$/.test(m[2])?v*1000:v;t=t.replace(m[0],' ')}
else if(m=t.match(/\b(\d+(?:[.,]\d+)?|um|uma|meio|meia|dois|duas|tres|quatro|cinco)\b/)){n=WN[m[1]]??+m[1].replace(',','.');t=t.replace(m[0],' ')}
if(grams==null)for(const[lab,re]of UN)if(re.test(t)){unit=lab;t=t.replace(re,' ');break}
return{grams,n,unit,tokens:t.split(/[^a-z0-9]+/).filter(w=>w&&!['de','do','da','dos','das','com','a','o','e','na','no'].includes(w))}}
function matchF(tk){if(!tk.length)return[];const sq=tk.map(stem);return WORDS.map((ws,i)=>({i,s:sq.filter(q=>ws.some(w=>w.startsWith(q))).length})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s||a.i-b.i).slice(0,6).map(o=>o.i)}
function resolve(p,f){if(p.grams!=null)return{n:r(p.grams,1),u:'g'};const ms=meas(f);
if(p.n!=null){const m=p.unit?ms.find(x=>x[0].startsWith(p.unit)):ms[0];if(m)return{n:p.n,u:m[0]};if(ms[0])return{n:p.n,u:ms[0][0],est:1};return{n:p.n>=10?p.n:100,u:'g',est:p.n<10}}
if(p.unit&&ms.length){const m=ms.find(x=>x[0].startsWith(p.unit))||ms[0];return{n:1,u:m[0],est:1}}
return{n:100,u:'g',est:1}}

function dtAnalyze(){let cm=dt.meal;const rows=[];
dt.txt.split(/\n|;|,\s+|\s+\+\s+|\s+e\s+/i).forEach(raw=>{const l=raw.trim().replace(/^[-•*]\s*/,'');if(!l)return;
const nl=norm(l).replace(/[:\-]/g,'').trim(),mi=nl.length>=4?MEALS.findIndex(x=>norm(x).startsWith(nl)||nl.startsWith(norm(x).split(' ')[0])&&nl.split(' ').length<=3&&!/\d/.test(nl)&&/lanche|jantar|almoco|ceia|cafe da manha/.test(nl)):-1;
if(mi>=0){cm=MEALS[mi];return}
const p=parseLine(l),c=matchF(p.tokens);rows.push({raw:l,p,cands:c,sel:c.length?c[0]:null,m:cm})});

function dtRender(){const tot={k:0,p:0,c:0,f:0};let n=0;

const f=F[rw.sel],q=resolve(rw.p,f),g=q.n*ug(f,q.u),x=calc(f,g);n++;for(const k in tot)tot[k]+=x[k];
return `<div class="row"><div class="top"><div class="info"><small>"${esc(rw.raw)}" → ${q.n} ${q.u=='g'?'g':q.u} (${r(g)} g)${q.est?' '+ic('alert')+' quantidade assumida':''}</small></div><button class="x" onclick="dtDel(${ri})" aria-label="Remover">${ic('x')}</button></div>
<select class="u" style="flex:1 1 100%" onchange="dtSel(${ri},+this.value)">${rw.cands.map(i=>`<option value="${i}" ${i==rw.sel?'selected':''}>${F[i].n}</option>`).join('')}</select>
<select class="u" onchange="dt.rows[${ri}].m=this.value">${MEALS.map(o=>`<option ${o==rw.m?'selected':''}>${o}</option>`).join('')}</select><small style="flex:1 1 100px">${r(x.k)} kcal · P ${r(x.p,1)} · C ${r(x.c,1)} · G ${r(x.f,1)}</small></div>`}).join('');
modal(`<b style="font-size:17px">Confira sua dieta</b><p class="mut" style="margin:4px 0;font-size:13px">Troque o alimento se o app entendeu errado.</p>${body}
<div class="note"><b>${r(tot.k)} kcal</b> · P ${r(tot.p,1)} · C ${r(tot.c,1)} · G ${r(tot.f,1)}</div>
<div class="acts"><button onclick="dt.rows=null;renderType()">Editar texto</button>${n?`<button class="pri" onclick="dtAdd()">Adicionar ${n} ${n>1?'itens':'item'}</button>`:''}</div>`)}
function dtSel(ri,i){dt.rows[ri].sel=i;dtRender()}

function warnBulk(tc){const t=totals(items()),g=S.goals;let bx=null,bo=0;['k','p','c','f'].forEach(x=>{const o=g[x]>0?(t[x]-g[x])/g[x]:0;if(o>0.005&&tc.some(a=>calc(F[a.i],a.g)[x]>0)&&o>bo){bo=o;bx=x}});

if(bx)checkOver(tc.reduce((b,a)=>calc(F[a.i],a.g)[bx]>calc(F[b.i],b.g)[bx]?a:b))}
function dtAdd(){let c=0;const tc=[];dt.rows.forEach(rw=>{if(rw.sel==null)return;const f=F[rw.sel],q=resolve(rw.p,f),ex=items().find(x=>x.i==rw.sel&&x.m==rw.m&&x.u==q.u);let id;if(ex){ex.n=r(ex.n+q.n,1);id=ex.id}else{id=Date.now()+Math.random();W().push({id,i:rw.sel,n:q.n,u:q.u,m:rw.m})}tc.push({id,i:rw.sel,g:q.n*ug(f,q.u),m:rw.m});c++});

function saveCF(){const v=id=>+(($('#'+id).value||'').replace(',','.'))||0,n=$('#cfn').value.trim(),keep=()=>({nm:n}),bad=m=>{$('#cferr').textContent=m};

const m=per?100/pg:1,o={n,k:r(k*m,1),p:r(p*m,1),c:r(c*m,1),f:r(f*m,1),b:r(v('cfb')*m,1),ms:per?[[$('#cfl').value.trim()||'porção',pg]]:[]};
S.custom.push(o);addCF(o);save();closeM();toast('Alimento criado');if(tab=='foods'){srch=true;q=n;renderFoods()}}
function askDelCF(ci){modal(`<b style="font-size:17px">Excluir "${esc(S.custom[ci].n)}"?</b><p class="mut" style="margin:6px 0 0;font-size:14px">Ele também será removido das dietas em que aparece.</p><div class="acts"><button onclick="renderCF('')">Cancelar</button><button class="pri" style="background:#FF5C5C;color:#fff" onclick="doDelCF(${ci})">Excluir</button></div>`)}
function doDelCF(ci){stamp();const c=S.custom[ci],j=F.findIndex(f=>f.cu&&f.n==c.n);S.custom.splice(ci,1);Object.keys(S.days).forEach(k=>S.days[k]=S.days[k].filter(it=>it.nm!=c.n));if(j>=0){F.splice(j,1);WORDS.splice(j,1)}remap();save();closeM();summary();if(tab=='diet')renderDiet();else if(tab=='foods')renderList();toast('Alimento excluído')}

const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
const CI={'Aves':'drum','Carne bovina':'steak','Porco e embutidos':'bacon','Peixes e frutos do mar':'fish','Ovos e laticínios':'milk','Arroz, massas e cereais':'wheat','Leguminosas':'bean','Tubérculos':'potato','Pães e salgados':'bread','Vegetais':'leaf','Frutas':'apple','Gorduras e oleaginosas':'nut','Doces e bebidas':'cake','Suplementos':'dumb','Whey (marcas)':'dumb','Barras de cereal (marcas)':'bar','Barras de proteína (marcas)':'bar','Pratos prontos':'bowl','Meus alimentos':'star'};
const TN={drum:1,steak:2,bacon:3,fish:1,egg:2,milk:3,wheat:1,bean:2,potato:3,bread:1,leaf:2,apple:3,nut:1,cake:2,cup:3,dumb:1,bowl:2,bar:3,drop:1,star:2,plate:3};
const ico=f=>{if(/^(ovo|clara|gema|omelete)/i.test(f.n))return'egg';if(/óleo|azeite|margarina|manteiga|maionese|banha/i.test(f.n))return'drop';if(f.g=='Doces e bebidas'&&/suco|cerveja|refrigerante|café|^chá|vinho|energético|isotônico|kombucha|água|limonada/i.test(f.n))return'cup';if(f.g=='Meus alimentos'&&/whey|proteína|barra/i.test(f.n))return'dumb';return CI[f.g]||'plate'};
const emo=f=>{const n=ico(f);return `<span class="em t${TN[n]||1}">${ic(n)}</span>`};
let lastAdd=null;
const ML={k:['Calorias','kcal'],p:['Proteína','g'],c:['Carboidrato','g'],f:['Gordura','g']};
function checkOver(a){const t=totals(items()),g=S.goals,fo=F[a.i],ad=calc(fo,a.g),K=['k','p','c','f'];
const X=K.filter(x=>g[x]>0&&t[x]>g[x]+0.5&&ad[x]>0);if(!X.length)return;lastAdd=a;
const lines=X.map(x=>`<div class="ml" style="color:#ef4444;padding:2px 0"><b>${ML[x][0]}</b><span>${r(t[x],1)} / ${g[x]} ${ML[x][1]} (+${r(t[x]-g[x],1)})</span></div>`).join('');
const cand=F.map((c,i)=>({c,i})).filter(({c,i})=>{if(c.g!=fo.g||i==a.i||c.k<fo.k*0.25)return false;const cc=calc(c,a.g);return X.every(x=>cc[x]<=ad[x])&&(fo.p<10||X.includes('p')||c.p>=fo.p*0.6)}).map(o=>{const cc=calc(o.c,a.g),nt={};K.forEach(x=>nt[x]=t[x]-ad[x]+cc[x]);o.nt=nt;o.sc=X.reduce((s,x)=>s+Math.max(0,nt[x]-g[x])/g[x],0);return o}).sort((p,q)=>p.sc-q.sc||p.nt.k-q.nt.k).slice(0,3);
const need=Math.max(...X.filter(x=>fo[x]>0).map(x=>(t[x]-g[x])/(fo[x]/100))),newG=Math.floor(a.g-need);
modal(`<b style="font-size:17px">${ic('alert')} Você excedeu a meta</b><p class="mut" style="margin:4px 0 8px;font-size:13px">Ao adicionar ${r(a.g)} g de ${fo.n}:</p>${lines}
${cand.length?`<h2>Troque por (mesma quantidade: ${r(a.g)} g)</h2>`+cand.map(o=>`<div class="row" style="flex-wrap:nowrap"><div class="info" style="flex:1 1 0"><b>${o.c.n}</b><small>${X.map(x=>`${ML[x][0]} ${r(o.nt[x],1)}/${g[x]}${o.nt[x]<=g[x]+0.5?' '+ic('check'):''}`).join(' · ')}</small></div><button class="add" style="flex:0 0 auto;padding:0 14px;font-size:14px" onclick="swapTo(${o.i})">Trocar</button></div>`).join(''):'<p class="mut" style="font-size:13px">Não encontrei uma troca melhor na mesma categoria.</p>'}
<div class="acts"><button onclick="closeM()">Manter assim</button>${newG>=10?`<button class="pri" onclick="setAdded(${newG})">Reduzir para ${newG} g</button>`:''}</div>`)}
function cutAdded(a,keepG){const it=gi(a.id);if(!it)return;it.n=r(it.n-(a.g-keepG)/ug(F[it.i],it.u),1);if(it.n<=0.05)S.days[S.date]=items().filter(x=>x.id!=a.id)}
function swapTo(ci){const a=lastAdd;cutAdded(a,0);W().push({id:Date.now()+Math.random(),i:ci,n:r(a.g,1),u:'g',m:a.m});closeM();save();summary();toast('Alimento trocado');scanAchievements(true)}
function setAdded(g){cutAdded(lastAdd,g);closeM();save();summary();toast(`Quantidade reduzida para ${g} g`);scanAchievements(true)}

S.custom=S.custom||[];S.custom.forEach(addCF);
S.customMeals=S.customMeals||[];S.customMeals.forEach(m=>{if(typeof m=='string'&&m.trim()&&!MEALS.some(x=>norm(x)==norm(m)))MEALS.push(m.trim())});
if(Array.isArray(S.mealOrder)){const ordered=S.mealOrder.filter(m=>typeof m=='string'&&MEALS.some(x=>norm(x)==norm(m)));MEALS=[...ordered,...MEALS.filter(m=>!ordered.some(x=>norm(x)==norm(m)))]}
S.days=S.days||{};if(S.items&&S.items.length){const t=todayK();S.days[t]=(S.days[t]||[]).concat(S.items)}delete S.items;
Object.values(S.days).forEach(L=>L.forEach(it=>{if(it.n==null){it.n=it.g;it.u='g'}}));
remap();S.date=todayK();tab='cal';
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
setTimeout(()=>{const b=$('#boot');b.classList.add('out');setTimeout(()=>{b.remove();S.goals?main():viewChoose()},220)},2000);
</script>
